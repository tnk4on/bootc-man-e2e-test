macos_vfkit_task:
  name: "E2E (macOS + vfkit)"
  macos_instance:
    image: ghcr.io/cirruslabs/macos-ventura-base:latest

  install_deps_script:
    - set -ex
    # Install podman (includes gvproxy in its libexec)
    - brew install podman
    # Install vfkit (standalone Homebrew formula)
    - brew install vfkit
    # Install bootc-man
    - brew tap tnk4on/bootc-man
    - brew install bootc-man

  verify_paths_script:
    - set -ex
    # Find where gvproxy is installed (bundled with Podman)
    - GVPROXY_PATH=$(find $(brew --cellar podman) -name gvproxy -type f 2>/dev/null | head -1)
    - echo "gvproxy found at $GVPROXY_PATH"
    - test -n "$GVPROXY_PATH"
    # Symlink gvproxy to a directory in PATH
    - sudo ln -sf "$GVPROXY_PATH" /usr/local/bin/gvproxy
    - which gvproxy
    - which vfkit
    - which bootc-man

  verify_versions_script:
    - set -ex
    - echo "=== bootc-man ==="
    - bootc-man version
    - echo "=== podman ==="
    - podman --version
    - echo "=== vfkit ==="
    - vfkit --version 2>&1
    - echo "=== gvproxy ==="
    - which gvproxy

  run_verify_script:
    - chmod +x scripts/verify-vfkit.sh
    - scripts/verify-vfkit.sh

  verify_bootc_man_script:
    - set -ex
    - bootc-man version
    - bootc-man status
