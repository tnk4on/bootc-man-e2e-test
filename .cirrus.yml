macos_vfkit_task:
  name: "E2E (macOS + vfkit)"
  macos_instance:
    image: ghcr.io/cirruslabs/macos-ventura-base:latest

  install_podman_script:
    - brew install podman

  install_bootc_man_script:
    - brew tap tnk4on/bootc-man
    - brew install bootc-man

  verify_versions_script:
    - echo "=== bootc-man ==="
    - bootc-man version
    - echo ""
    - echo "=== podman ==="
    - podman version --format "{{.Version}}" || podman --version
    - echo ""
    - echo "=== vfkit ==="
    - which vfkit && vfkit --version 2>&1 || echo "vfkit not found"
    - echo ""
    - echo "=== gvproxy ==="
    - which gvproxy && gvproxy --help 2>&1 | head -1 || echo "gvproxy not found"

  run_verify_script:
    - chmod +x scripts/verify-vfkit.sh
    - scripts/verify-vfkit.sh

  bootc_man_check_script:
    - bootc-man ci check || echo "ci check completed (some checks may require Podman Machine)"
