macos_vfkit_task:
  name: "E2E (macOS + vfkit)"
  macos_instance:
    image: ghcr.io/cirruslabs/macos-ventura-base:latest

  env:
    # vfkit and gvproxy are installed to libexec/bootc-man/ by Homebrew formula
    PATH: "${HOMEBREW_PREFIX}/libexec/bootc-man:${PATH}"

  install_podman_script:
    - brew install podman

  install_bootc_man_script:
    - brew tap tnk4on/bootc-man
    - brew install bootc-man
    # Verify libexec binaries exist
    - ls -la $(brew --prefix)/libexec/bootc-man/

  verify_versions_script:
    - set -ex
    - echo "=== bootc-man ==="
    - bootc-man version
    - echo ""
    - echo "=== podman ==="
    - podman version --format "{{.Version}}" || podman --version
    - echo ""
    - echo "=== vfkit ==="
    - which vfkit
    - vfkit --version 2>&1
    - echo ""
    - echo "=== gvproxy ==="
    - which gvproxy

  run_verify_script:
    - chmod +x scripts/verify-vfkit.sh
    - scripts/verify-vfkit.sh

  verify_bootc_man_script:
    - set -ex
    - bootc-man version
    - bootc-man status
